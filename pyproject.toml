[project]
name = "dsdg-databricks-hackathon-demo"
version = "0.1.0"
description = "End-to-end Databricks demo: Delta, AI Functions, MLflow, Unity Catalog, Spark scoring"
readme = "README.md"
requires-python = ">=3.10"
# Spark, pandas and scikit-learn come with Databricks serverless; these are the extras the notebook installs.
dependencies = [
    "mlflow>=3.1",
    "plotly",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_utils"]

[tool.ruff]
line-length = 140
src = ["src"]
extend-exclude = ["notebooks"]
