[project]
name = "dsdg-databricks-hackathon-demo"
version = "0.1.0"
description = "Bare-bones Databricks tool tour: Volumes, Delta, SQL, AI Functions, MLflow, Unity Catalog"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Spark, pandas and scikit-learn come with Databricks serverless; the notebook installs these extras with `%pip install ..`.
dependencies = [
    "mlflow>=3.1",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No Python package to ship: installing the project just pulls in its dependencies.
bypass-selection = true

[tool.ruff]
line-length = 140
builtins = ["spark", "dbutils", "display", "displayHTML"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
